<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>wbi 画廊</title>
<link rel="stylesheet" href="style.css?v20260910b">
</head>
<body>

<div class="card">
  <h3>🖼 出图记录 <span class="tagx" id="cnt">—</span></h3>
  <div class="row">
    <button id="btnReload">🔄 刷新</button>
    <button class="fx" id="btnFilter" style="width:auto">全部</button>
  </div>
  <div class="hint" id="last">加载中…</div>
</div>

<div class="card">
  <div class="gal" id="gal"></div>
  <div class="empty" id="empty" style="display:none">
    还没有出图记录<br><br>
    去【🎛 控制台】写提示词 → 点「⚡ 立即生图」
  </div>
  <div class="hint" id="galHint" style="display:none">
    图片存在私有仓库里，本页用你的令牌实时读取（所以加载要等一两秒）
  </div>
</div>

<div class="card">
  <h3>📋 列表</h3>
  <div class="list" id="list"><div class="it">加载中…</div></div>
</div>

<div id="toasts"></div>
<script src="app.js?v20260910b"></script>
<script>
var HIST = [], ONLY_OK = false;
var FILTERS = [['全部',false],['只看成功',true]]; var fi = 0;

function render(){
  const rows = HIST.filter(function(x){ return !ONLY_OK || (x.ok && x.file); });
  $('cnt').textContent = rows.length + ' 条';
  const g = $('gal'), l = $('list');
  const good = rows.filter(function(x){ return x.ok && x.file; });
  if(!rows.length){ g.innerHTML=''; $('empty').style.display='block'; $('galHint').style.display='none';
    l.innerHTML='<div class="it">无记录</div>'; return; }
  $('empty').style.display='none';
  $('galHint').style.display = good.length ? 'block' : 'none';

  g.innerHTML = good.slice(0,60).map(function(x){
    const title = String(x.model||'') + ' · ' + String(x.prompt||'').slice(0,40);
    return '<a href="javascript:;" onclick="openLightbox(\'outputs/' + x.file + '\',\'' +
      title.replace(/'/g,'') + '\')">' +
      '<img data-img="outputs/' + x.file + '" alt=""></a>';
  }).join('') || '<div class="hint">无成功记录</div>';

  /* 先把列表填好，避免后面任何异常导致列表卡在“加载中” */
  l.innerHTML = rows.slice(0,80).map(function(x){
    const t = x.ts ? new Date(x.ts*1000).toLocaleString('zh-CN') : '';
    if(x.ok){
      return '<div class="it"><span class="nm" title="' + String(x.prompt||'').replace(/"/g,'') + '">' +
        (x.model||'') + ' · ' + String(x.prompt||'').slice(0,24) + '</span>' +
        '<span class="mt">' + Math.round((x.bytes||0)/1024) + 'KB<br>' + t.slice(5,16) + '</span>' +
        '<button onclick="openLightbox(\'outputs/' + x.file + '\',\'' + String(x.model||'').replace(/'/g,'') + '\')">看</button></div>';
    }
    return '<div class="it"><span class="nm" style="color:var(--err)">✕ ' + String(x.error||'').slice(0,42) + '</span>' +
           '<span class="mt">' + t.slice(5,16) + '</span></div>';
  }).join('');

  /* 列表填完后再异步填图（失败也不影响列表） */
  try { if(typeof hydrateImages === 'function') hydrateImages(g);
        else toast('页面资源是旧缓存，请强制刷新（已自动重载）','warn',6000), setTimeout(function(){ location.reload(true); }, 1200);
  } catch(e){ toast('填图异常：'+e.message,'err',6000); }
}

async function load(silent){
  if(!WBI.TOK){ $('last').textContent='请先连接令牌'; $('list').innerHTML='<div class="it">未连接</div>'; return; }
  const h = await readFile('outputs/history.json');
  try{ HIST = JSON.parse(h.text || '[]'); }catch(e){ HIST = []; }
  const ok = HIST.filter(function(x){ return x.ok && x.file; });
  if(ok[0]){
    const t = new Date((ok[0].ts||0)*1000);
    $('last').innerHTML = '最近：<b>' + ok[0].file + '</b>（' + Math.round((ok[0].bytes||0)/1024) +
      ' KB，' + ok[0].source + '/' + ok[0].model + '，' + t.toLocaleString('zh-CN') + '）';
  } else $('last').textContent = '还没有出图记录';
  render();
  if(!silent && !ok.length) toast('暂无出图记录','warn');
}

$('btnReload').onclick = function(){ busy($('btnReload'), async function(){
  await load(true); toast('已刷新（'+HIST.length+' 条）','ok');
}); };
$('btnFilter').onclick = function(){ fi=(fi+1)%FILTERS.length; ONLY_OK=FILTERS[fi][1];
  $('btnFilter').textContent=FILTERS[fi][0]; render(); };

bootPage({ title:'画廊', active:'gallery.html', onReady:function(){
  load(); WBI.TIMER = setInterval(function(){ load(true); }, 30000);
}});
</script>
</body>
</html>
