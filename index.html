<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>wbi 控制台</title>
<style>
  :root{--bg:#0d1117;--bg2:#161b22;--bg3:#1f2632;--bd:#2c3444;--fg:#e6edf3;--fg2:#98a3b3;--fg3:#66707f;
        --ac:#4c8dff;--ok:#3fb950;--warn:#d29922;--err:#f85149;--pk:#bc8cff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);padding:14px 14px 40px;max-width:720px;margin:0 auto;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .hd{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .hd b{font-size:18px}.hd b i{color:var(--ac);font-style:normal}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--fg3);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(63,185,80,.15)}
  .dot.run{background:var(--warn);animation:pl 1.1s infinite}@keyframes pl{50%{opacity:.3}}
  .card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
  .card>h3{margin:0 0 11px;font-size:14px;font-weight:600;color:var(--fg2);letter-spacing:.4px}
  input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--bd);color:var(--fg);
    border-radius:11px;padding:12px;font-size:15px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--ac)}
  textarea{min-height:88px;resize:vertical;line-height:1.5}
  button{border:1px solid var(--bd);background:var(--bg3);color:var(--fg);border-radius:11px;padding:12px 14px;
    font-size:15px;font-family:inherit;cursor:pointer;font-weight:500;transition:.15s;width:100%}
  button:active{transform:scale(.985)}
  button:disabled{opacity:.4}
  button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
  button.go{background:var(--ok);border-color:var(--ok);color:#04120a}
  button.dg{background:transparent;border-color:var(--err);color:var(--err)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .row{display:flex;gap:9px;align-items:center}
  .row>*{flex:1}.row>.fx{flex:none}
  .lbl{font-size:12.5px;color:var(--fg3);margin:9px 0 5px}
  .stat{background:var(--bg3);border-radius:11px;padding:10px 11px;text-align:center}
  .stat .k{font-size:11.5px;color:var(--fg3)}
  .stat .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
  .tagx{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--bg3);
    color:var(--fg2);border:1px solid var(--bd);margin-left:5px}
  .bar{height:7px;background:var(--bg3);border-radius:20px;overflow:hidden;margin:11px 0 0}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--pk));width:0;transition:width .5s}
  .list{max-height:270px;overflow:auto;border:1px solid var(--bd);border-radius:11px;margin-top:9px}
  .it{display:flex;gap:8px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--bd);font-size:13px}
  .it:last-child{border-bottom:0}
  .it .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .mt{color:var(--fg3);font-size:11.5px;flex:none}
  .it button{width:auto;padding:5px 12px;font-size:12.5px}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;margin-top:10px}
  .gal a{display:block;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:var(--bg3)}
  .gal img{width:100%;height:100%;object-fit:cover;display:block}
  .hint{font-size:12px;color:var(--fg3);margin-top:8px;line-height:1.5}
  .log{background:#080b10;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:9px;
    font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--fg2);max-height:210px;overflow:auto;
    white-space:pre-wrap;word-break:break-all}
  details{border-top:1px solid var(--bd);padding-top:11px;margin-top:11px}
  summary{cursor:pointer;color:var(--fg2);font-size:13.5px;font-weight:500;list-style:none;padding:3px 0}
  summary::-webkit-details-marker{display:none}
  summary:before{content:"▸ ";color:var(--fg3)}details[open] summary:before{content:"▾ "}
  #toasts{position:fixed;left:0;right:0;bottom:0;padding:0 14px 18px;display:flex;flex-direction:column;
    gap:8px;pointer-events:none;z-index:99}
  .toast{background:#232c3a;border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:11px;
    padding:12px 14px;font-size:14px;box-shadow:0 8px 26px rgba(0,0,0,.5);animation:in .22s ease;word-break:break-word;white-space:pre-wrap}
  .toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--err)}.toast.warn{border-left-color:var(--warn)}
  @keyframes in{from{opacity:0;transform:translateY(14px)}}
  .busy{position:relative;pointer-events:none;opacity:.75}
  .busy:after{content:"";position:absolute;right:12px;top:50%;width:14px;height:14px;margin-top:-7px;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="hd"><i class="dot" id="connDot"></i><b>wbi <i>控制台</i></b>
  <span class="tagx" id="connTag">未连接</span></div>

<div class="card" id="cardConn">
  <h3>① 连接仓库</h3>
  <input type="text" id="repo" placeholder="owner/repo" value="shake24342/wbi-image-api">
  <div class="lbl"></div>
  <input type="password" id="tok" placeholder="粘贴 GitHub 令牌（ghp_ 开头）">
  <div class="hint" id="tokInfo"></div>
  <div class="row" style="margin-top:11px">
    <button class="pri" id="btnConn">连接</button>
    <button class="fx" id="btnForget" style="width:auto">清除</button>
  </div>
  <div class="hint">令牌只存在你手机浏览器里。需要 <code>repo</code> + <code>workflow</code> 权限。</div>
</div>

<div class="card">
  <h3>② 云端会话</h3>
  <div class="g3">
    <div class="stat"><div class="k">状态</div><div class="v" id="stState">—</div></div>
    <div class="stat"><div class="k">剩余</div><div class="v" id="stLeft">—</div></div>
    <div class="stat"><div class="k">轮次</div><div class="v" id="stRounds">—</div></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="row" style="margin-top:11px">
    <button class="go" id="btnStart">▶ 开始</button>
    <button class="fx" id="minSel" style="width:92px;padding:12px 6px">15分</button>
  </div>
  <div class="g2" style="margin-top:9px">
    <button id="btnRenew">⏱ 续期 +15分</button>
    <button class="dg" id="btnStop">■ 停止</button>
  </div>
  <div class="hint">不续期 → 到点云端进程自动结束（省 Actions 分钟）。当前 run：<span id="stRun">—</span></div>
</div>

<div class="card">
  <h3>③ 生图 <span class="tagx" id="queueTag">队列 0</span></h3>
  <div class="lbl">提示词（务必写明「成年 / adult」）</div>
  <textarea id="prompt" placeholder="例：25岁成年女性，黑长直，和服，神社，秋天落叶，写实摄影，35mm 胶片，masterpiece"></textarea>
  <div class="lbl">模型</div>
  <select id="model"></select>
  <div class="g2">
    <div><div class="lbl">尺寸</div>
      <select id="dim"><option>3:4</option><option>1:1</option><option>2:3</option><option>4:3</option><option>3:2</option><option>16:9</option><option>9:16</option></select></div>
    <div><div class="lbl">张数</div>
      <select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="pri" id="btnNow">⚡ 立即生图</button>
    <button id="btnQueue">＋ 排队</button>
  </div>
  <div class="hint">「立即生图」= 单开一次云端 run，约 1~3 分钟出图，完成后自动回传（下面看图）。</div>
  <div id="lastOut" class="hint"></div>
  <div class="gal" id="gal"></div>
</div>

<div class="card">
  <details>
    <summary>④ 全部模型（dzmm 7 + PixAI 1.85 万）</summary>
    <input type="text" id="mSearch" placeholder="搜索，如 realvis / tsubaki / 写实" style="margin-top:9px">
    <div class="g2" style="margin-top:9px">
      <select id="mSource"><option value="">全部来源</option><option value="dzmm">dzmm</option><option value="pixai">PixAI</option></select>
      <select id="mType"><option value="">全部类型</option></select>
    </div>
    <button id="btnLoadModels" style="margin-top:9px">加载全部模型 <span class="tagx" id="mCnt">—</span></button>
    <div class="list" id="mList"><div class="it">点上面按钮加载</div></div>
  </details>
  <details>
    <summary>号池状态 &amp; 风控</summary>
    <div class="g3" style="margin-top:10px">
      <div class="stat"><div class="k">dzmm</div><div class="v" id="pDzmm">—</div></div>
      <div class="stat"><div class="k">PixAI</div><div class="v" id="pPixai">—</div></div>
      <div class="stat"><div class="k">风控</div><div class="v" id="stWaf" style="font-size:13px">—</div></div>
    </div>
    <details><summary>运行日志</summary><div class="log" id="log">—</div></details>
  </details>
</div>

<div id="toasts"></div>

<script>
const $=i=>document.getElementById(i);
const API='https://api.github.com';
const LS_R='wbi.repo', LS_T='wbi.tok';
let REPO='', TOK='', MODELS=[], RUNS=[], TIMER=null;

function toast(text, kind, ms){
  const d=document.createElement('div');
  d.className='toast '+(kind||''); d.textContent=text;
  $('toasts').appendChild(d);
  setTimeout(function(){ d.style.transition='.3s'; d.style.opacity=0; setTimeout(function(){d.remove()},320); }, ms||4200);
  while($('toasts').children.length>3) $('toasts').firstChild.remove();
}
async function busy(btn, fn){
  const old=btn.textContent; btn.classList.add('busy'); btn.disabled=true;
  try{ return await fn(); }
  finally{ btn.classList.remove('busy'); btn.disabled=false; btn.textContent=old; }
}

function cleanTok(v){
  return (v||'').replace(/[\u200B-\u200D\u2060\uFEFF\u00A0]/g,'').replace(/\s+/g,'')
                 .replace(/^["'`]+|["'`]+$/g,'');
}
function tokInfo(){
  const raw=$('tok').value, c=cleanTok(raw);
  if(!c){ $('tokInfo').textContent=''; return; }
  const ok=c.indexOf('ghp_')===0||c.indexOf('github_pat_')===0;
  let s='长度 '+c.length+' · '+(ok?'格式 ✓':'格式 ✗ 应以 ghp_ 开头');
  if(c!==raw) s+=' · <span style="color:var(--warn)">已清理 '+(raw.length-c.length)+' 个多余字符</span>';
  $('tokInfo').innerHTML=s; $('tokInfo').style.color=ok?'var(--ok)':'var(--err)';
}
$('tok').addEventListener('input',tokInfo);
$('tok').addEventListener('paste',function(){ setTimeout(tokInfo,30); });

async function gh(path,opt){
  opt=opt||{};
  const r=await fetch(API+path,{method:opt.method||'GET',
    headers:{Authorization:'token '+TOK,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:opt.body});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){j={}}
  if(!r.ok) throw new Error((j&&(j.message||j.error))||('HTTP '+r.status));
  return j;
}
const enc=function(s){ return btoa(unescape(encodeURIComponent(s))); };
const dec=function(s){ return decodeURIComponent(escape(atob(s.replace(/\n/g,'')))); };
async function readFile(p){
  try{ const j=await gh('/repos/'+REPO+'/contents/'+p+'?t='+Date.now()); return {sha:j.sha,text:dec(j.content)}; }
  catch(e){ return {sha:null,text:null}; }
}
async function writeFile(p,obj,msg){
  const cur=await readFile(p);
  const b={message:msg||('update '+p),content:enc(typeof obj==='string'?obj:JSON.stringify(obj,null,1))};
  if(cur.sha) b.sha=cur.sha;
  return gh('/repos/'+REPO+'/contents/'+p,{method:'PUT',body:JSON.stringify(b)});
}
function dispatch(wf,inp){
  return gh('/repos/'+REPO+'/actions/workflows/'+wf+'/dispatches',
    {method:'POST',body:JSON.stringify({ref:'main',inputs:inp||{}})});
}

$('repo').value=localStorage.getItem(LS_R)||'shake24342/wbi-image-api';
$('tok').value=localStorage.getItem(LS_T)||'';
$('btnForget').onclick=function(){ localStorage.removeItem(LS_T); $('tok').value=''; tokInfo();
  $('connTag').textContent='未连接'; $('connDot').className='dot'; toast('已清除令牌'); };

$('btnConn').onclick=function(){ busy($('btnConn'),async function(){
  REPO=$('repo').value.trim(); TOK=cleanTok($('tok').value); $('tok').value=TOK; tokInfo();
  if(!REPO||!TOK){ toast('请填仓库和令牌','err'); return; }
  if(TOK.indexOf('ghp_')!==0&&TOK.indexOf('github_pat_')!==0){ toast('令牌格式不对（应以 ghp_ 开头）','err'); return; }
  try{
    const u=await gh('/user');
    localStorage.setItem(LS_R,REPO); localStorage.setItem(LS_T,TOK);
    $('connTag').textContent=u.login; $('connDot').className='dot on';
    $('cardConn').style.display='none';
    toast('✅ 已连接 '+u.login,'ok');
    refreshAll(); if(TIMER)clearInterval(TIMER); TIMER=setInterval(refreshAll,20000);
  }catch(e){
    $('connDot').className='dot';
    if(/Bad credentials/i.test(e.message))
      toast('令牌无效（Bad credentials）\n检查：①整行复制无空格 ②未过期 ③未撤销','err',9000);
    else if(/Not Found/i.test(e.message))
      toast('读不到仓库 '+REPO+'\n检查仓库名与 token 的 repo 权限','err',9000);
    else toast('连接失败：'+e.message,'err',9000);
  }
}); };

var MINUTES=[5,15,30,60], mi=1;
$('minSel').onclick=function(){ mi=(mi+1)%MINUTES.length; $('minSel').textContent=MINUTES[mi]+'分'; };

$('btnStart').onclick=function(){ busy($('btnStart'),async function(){
  const m=MINUTES[mi];
  await writeFile('data/session_renew.json',{expiresAt:Math.floor(Date.now()/1000)+m*60,mode:'mixed',stop:false},'session: start by panel');
  await dispatch('session.yml',{minutes:String(m),mode:'mixed'});
  toast('✅ 已启动云端会话（'+m+' 分钟）','ok'); setTimeout(refreshAll,4000);
}); };
$('btnRenew').onclick=function(){ busy($('btnRenew'),async function(){
  await writeFile('data/session_renew.json',{expiresAt:Math.floor(Date.now()/1000)+15*60,mode:'mixed',stop:false},'session: +15min');
  toast('⏱ 已续期 +15 分钟','ok'); refreshAll();
}); };
$('btnStop').onclick=function(){ busy($('btnStop'),async function(){
  await writeFile('data/session_renew.json',{expiresAt:0,stop:true},'session: stop by panel');
  toast('■ 已发停止信号（云端下一轮退出）','warn'); refreshAll();
}); };

$('btnNow').onclick=function(){ busy($('btnNow'),async function(){
  const p=$('prompt').value.trim(); if(!p){ toast('请先写提示词','err'); return; }
  const m=$('model').value;
  await dispatch('generate.yml',{prompt:p,model:m,dim:$('dim').value,count:$('count').value});
  toast('⚡ 已提交云端生图（'+m+'）\n约 1~3 分钟后在下面图廊看到结果','ok',7000);
  setTimeout(refreshAll,15000);
}); };
$('btnQueue').onclick=function(){ busy($('btnQueue'),async function(){
  const p=$('prompt').value.trim(); if(!p){ toast('请先写提示词','err'); return; }
  const cur=await readFile('data/queue.json'); let q=[]; try{q=JSON.parse(cur.text||'[]')}catch(e){}
  q.push({id:'p'+Date.now(),prompt:p,model:$('model').value,dim:$('dim').value,ts:Math.floor(Date.now()/1000)});
  await writeFile('data/queue.json',q,'queue: add job');
  toast('＋ 已排队（共 '+q.length+' 条）\n会话跑着时会自动取走执行','ok',6000); refreshQueue();
}); };

var DZ=[['anime','dzmm anime（二次元 默认）'],['anima','dzmm anima'],['iroha','dzmm Iroha 高质量二次元'],
  ['z-image','dzmm z-image（隐藏）'],['nalang-dream','dzmm Nalang Dream 写实·无审核 ★'],
  ['nalang-coser-2','dzmm Nalang Coser-2'],['kagami','dzmm kagami 写实最高清（1 credit，有敏感词过滤）']];
var PX=[['pixai:tsubaki2','PixAI Tsubaki.2（26B 旗舰）★'],['pixai:tsubaki','PixAI Tsubaki（7B）'],
  ['pixai:realvisxl','PixAI RealVisXL V4.0（写实）'],['pixai:cyberrealistic','PixAI CyberRealistic Pony'],
  ['pixai:jibmix','PixAI Jib Mix Realistic XL'],['pixai:nova-unreal','PixAI Nova Unreal XL'],
  ['pixai:analog-madness','PixAI Analog Madness'],['pixai:epicrealism','PixAI epiCRealism XL']];
(function(){
  const s=$('model'); s.innerHTML='';
  s.appendChild(new Option('auto（自动选源 · 推荐）','auto'));
  const g1=document.createElement('optgroup'); g1.label='dzmm（无审核 · 75 张/号/天）';
  DZ.forEach(function(x){ g1.appendChild(new Option(x[1],'dzmm:'+x[0])); }); s.appendChild(g1);
  const g2=document.createElement('optgroup'); g2.label='PixAI（画质高 · 有审核）';
  PX.forEach(function(x){ g2.appendChild(new Option(x[1],x[0])); }); s.appendChild(g2);
})();

$('btnLoadModels').onclick=function(){ busy($('btnLoadModels'),async function(){
  const rows=[];
  DZ.forEach(function(x){ rows.push({id:'dzmm:'+x[0],t:'dzmm '+x[1],src:'dzmm',y:'base'}); });
  PX.forEach(function(x){ rows.push({id:x[0],t:x[1],src:'pixai',y:'base'}); });
  try{ const f=await readFile('docs/pixai_models_index.json');
       if(f.text) JSON.parse(f.text).forEach(function(m){ rows.push({id:'pixai:'+m.t+'#'+m.v,t:m.t,src:'pixai',y:m.y}); });
  }catch(e){}
  MODELS=rows;
  const ts=[]; rows.forEach(function(r){ if(r.y&&ts.indexOf(r.y)<0) ts.push(r.y); }); ts.sort();
  $('mType').innerHTML='<option value="">全部类型</option>'+ts.map(function(t){return '<option>'+t+'</option>'}).join('');
  $('mCnt').textContent=rows.length.toLocaleString()+' 个'; renderModels();
  toast('已加载 '+rows.length+' 个模型','ok');
}); };
function renderModels(){
  const kw=($('mSearch').value||'').toLowerCase(), src=$('mSource').value, ty=$('mType').value;
  const r=MODELS.filter(function(m){ return (!src||m.src===src)&&(!ty||m.y===ty)&&(!kw||m.t.toLowerCase().indexOf(kw)>=0); });
  const head=r.slice(0,300);
  $('mList').innerHTML = head.length? head.map(function(m){
    return '<div class="it"><span class="nm">'+m.t+'</span><span class="mt">'+m.src+'</span><button onclick="useModel(\''+m.id+'\')">用</button></div>';
  }).join('') : '<div class="it">无匹配</div>';
  if(r.length>head.length) $('mList').insertAdjacentHTML('beforeend',
    '<div class="it" style="color:var(--fg3)">…还有 '+(r.length-head.length)+' 个，用搜索缩小范围</div>');
}
['mSearch','mSource','mType'].forEach(function(i){ $(i).oninput=renderModels; $(i).onchange=renderModels; });
window.useModel=function(id){
  const s=$('model'); let o=null;
  for(var i=0;i<s.options.length;i++) if(s.options[i].value===id) o=s.options[i];
  if(!o){ o=new Option(id,id); s.add(o); }
  s.value=id; toast('已选模型：'+id,'ok');
  $('prompt').scrollIntoView({behavior:'smooth',block:'center'});
};

async function refreshQueue(){
  try{ const q=await readFile('data/queue.json'); let n=0;
       try{n=(JSON.parse(q.text||'[]')).length}catch(e){}
       $('queueTag').textContent='队列 '+n; }catch(e){}
}
async function refreshAll(){
  if(!TOK||!REPO) return;
  try{
    const arr=await Promise.all([readFile('data/session_status.json'),
      readFile('data/session_renew.json'),readFile('data/session.json')]);
    let st={},re={},sd={};
    try{st=JSON.parse(arr[0].text||'{}')}catch(e){}
    try{re=JSON.parse(arr[1].text||'{}')}catch(e){}
    try{sd=JSON.parse(arr[2].text||'{}')}catch(e){}
    const exp=Math.max(re.expiresAt||0,sd.expiresAt||0), left=exp-Math.floor(Date.now()/1000);
    $('stState').textContent = re.stop?'已停止':(left>0?'运行中':'已到期');
    $('stState').style.color = re.stop?'var(--err)':(left>0?'var(--ok)':'var(--fg3)');
    $('stLeft').textContent = left>0? (Math.floor(left/60)+':'+String(left%60).padStart(2,'0')) : '—';
    $('stRounds').textContent = (st.rounds===undefined||st.rounds===null)? '—' : st.rounds;
    const tot=Math.max(1,(sd.expiresAt||exp)-(sd.startedAt||exp-900));
    $('bar').style.width=Math.max(0,Math.min(100,left>0?left/tot*100:0))+'%';
    if(st.waf){ const w=st.waf, bad=(w.wafStreak>0)||w.circuitOpen;
      $('stWaf').textContent = w.circuitOpen?('熔断 '+w.circuitLeftSec+'s'):(w.pausedSec>0?('退避 '+w.pausedSec+'s'):'正常');
      $('stWaf').style.color = bad?'var(--warn)':'var(--ok)'; }
  }catch(e){}
  try{
    const r=await gh('/repos/'+REPO+'/actions/runs?per_page=6'); RUNS=r.workflow_runs||[];
    let s=null; for(var i=0;i<RUNS.length;i++) if((RUNS[i].path||'').indexOf('session.yml')>=0){ s=RUNS[i]; break; }
    if(!s) s=RUNS[0];
    if(s){ $('stRun').textContent=s.status+(s.conclusion?' / '+s.conclusion:'')+' #'+s.run_number;
           $('connDot').className='dot'+((s.status==='in_progress')?' run':' on'); }
  }catch(e){}
  try{ const d=await readFile('data/dzmm_accounts.json'); let n=0;
       try{n=(JSON.parse(d.text||'[]')).length}catch(e){} $('pDzmm').textContent=n||'—'; }catch(e){}
  try{ const p=await readFile('data/pixai_pool.json'); let a=[];
       try{a=JSON.parse(p.text||'[]')}catch(e){}
       $('pPixai').textContent=a.length?(a.filter(function(x){return !x.dead}).length+'/'+a.length):'—'; }catch(e){}
  try{
    const h=await readFile('outputs/history.json'); let hist=[]; try{hist=JSON.parse(h.text||'[]')}catch(e){}
    const ok=hist.filter(function(x){ return x.ok&&x.file; });
    const base='https://raw.githubusercontent.com/'+REPO+'/main/outputs/';
    $('gal').innerHTML=ok.slice(0,12).map(function(x){
      return '<a href="'+base+x.file+'" target="_blank"><img loading="lazy" src="'+base+x.file+'"></a>'; }).join('');
    if(ok[0]){ const t=new Date((ok[0].ts||0)*1000);
      $('lastOut').innerHTML='最近一张：<b>'+ok[0].file+'</b>（'+Math.round((ok[0].bytes||0)/1024)+' KB，'+ok[0].source+'/'+ok[0].model+'，'+t.toLocaleTimeString('zh-CN')+'）'; }
    else $('lastOut').textContent='还没有出图记录 — 提交一张试试';
  }catch(e){}
  refreshQueue();
}

if($('tok').value){ tokInfo(); $('btnConn').click(); }
</script>
</body>
</html>
