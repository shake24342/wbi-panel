<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>wbi 控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h3>① 云端会话</h3>
  <div class="g3">
    <div class="stat"><div class="k">状态</div><div class="v" id="stState">—</div></div>
    <div class="stat"><div class="k">剩余</div><div class="v" id="stLeft">—</div></div>
    <div class="stat"><div class="k">轮次</div><div class="v" id="stRounds">—</div></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="row" style="margin-top:11px">
    <button class="go" id="btnStart">▶ 开始</button>
    <button class="fx" id="minSel" style="width:92px;padding:12px 6px">15分</button>
  </div>
  <div class="g2" style="margin-top:9px">
    <button id="btnRenew">⏱ 续期 +15分</button>
    <button class="dg" id="btnStop">■ 停止</button>
  </div>
  <div class="hint">不续期 → 到点云端进程自动结束（省 Actions 分钟）。当前 run：<span id="stRun">—</span></div>
</div>

<div class="card">
  <h3>② 生图 <span class="tagx" id="queueTag">队列 0</span></h3>
  <div class="lbl">提示词（务必写明「成年 / adult」）</div>
  <textarea id="prompt" placeholder="例：25岁成年女性，黑长直，和服，神社，秋天落叶，写实摄影，35mm 胶片，masterpiece"></textarea>
  <div class="lbl">模型</div>
  <select id="model"></select>
  <div class="g2">
    <div><div class="lbl">尺寸</div>
      <select id="dim"><option>3:4</option><option>1:1</option><option>2:3</option><option>4:3</option><option>3:2</option><option>16:9</option><option>9:16</option></select></div>
    <div><div class="lbl">张数</div>
      <select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="pri" id="btnNow">⚡ 立即生图</button>
    <button id="btnQueue">＋ 排队</button>
  </div>
  <div class="hint">「立即生图」= 单开一次云端 run，约 1~3 分钟出图 → 出完在【🖼 画廊】看。</div>
</div>

<div id="toasts"></div>
<script src="app.js"></script>
<script>
function fillModel(){
  const s=$('model'); s.innerHTML='';
  s.appendChild(new Option('auto（自动选源 · 推荐）','auto'));
  const g1=document.createElement('optgroup'); g1.label='dzmm（无审核 · 75 张/号/天）';
  DZMM_MODELS.forEach(function(x){ g1.appendChild(new Option('dzmm '+x[1],'dzmm:'+x[0])); }); s.appendChild(g1);
  const g2=document.createElement('optgroup'); g2.label='PixAI（画质高 · 有审核）';
  PIXAI_MODELS.forEach(function(x){ g2.appendChild(new Option('PixAI '+x[1],x[0])); }); s.appendChild(g2);
}
fillModel();

var MINUTES=[5,15,30,60], mi=1;
$('minSel').onclick=function(){ mi=(mi+1)%MINUTES.length; $('minSel').textContent=MINUTES[mi]+'分'; };

async function refresh(){
  if(!WBI.TOK) return;
  try{
    const a=await Promise.all([readFile('data/session_status.json'),readFile('data/session_renew.json'),readFile('data/session.json')]);
    let st={},re={},sd={};
    try{st=JSON.parse(a[0].text||'{}')}catch(e){}
    try{re=JSON.parse(a[1].text||'{}')}catch(e){}
    try{sd=JSON.parse(a[2].text||'{}')}catch(e){}
    const exp=Math.max(re.expiresAt||0,sd.expiresAt||0), left=exp-Math.floor(Date.now()/1000);
    $('stState').textContent = re.stop?'已停止':(left>0?'运行中':'已到期');
    $('stState').style.color = re.stop?'var(--err)':(left>0?'var(--ok)':'var(--fg3)');
    $('stLeft').textContent = left>0 ? (Math.floor(left/60)+':'+String(left%60).padStart(2,'0')) : '—';
    $('stRounds').textContent = (st.rounds===undefined||st.rounds===null)?'—':st.rounds;
    const tot=Math.max(1,(sd.expiresAt||exp)-(sd.startedAt||exp-900));
    $('bar').style.width=Math.max(0,Math.min(100,left>0?left/tot*100:0))+'%';
  }catch(e){}
  try{ const r=await gh('/repos/'+WBI.REPO+'/actions/runs?per_page=6'); const R=r.workflow_runs||[];
    let s=null; for(var i=0;i<R.length;i++) if((R[i].path||'').indexOf('session.yml')>=0){ s=R[i]; break; }
    if(!s) s=R[0];
    if(s){ $('stRun').textContent=s.status+(s.conclusion?' / '+s.conclusion:'')+' #'+s.run_number;
      $('connDot').className='dot'+((s.status==='in_progress')?' run':' on'); }
  }catch(e){}
  try{ const q=await readFile('data/queue.json'); let n=0; try{n=(JSON.parse(q.text||'[]')).length}catch(e){}
       $('queueTag').textContent='队列 '+n; }catch(e){}
}

$('btnStart').onclick=function(){ busy($('btnStart'),async function(){
  const m=MINUTES[mi];
  await writeFile('data/session_renew.json',{expiresAt:Math.floor(Date.now()/1000)+m*60,mode:'mixed',stop:false},'session: start by panel');
  await dispatch('session.yml',{minutes:String(m),mode:'mixed'});
  toast('✅ 已启动云端会话（'+m+' 分钟）','ok'); setTimeout(refresh,4000);
}); };
$('btnRenew').onclick=function(){ busy($('btnRenew'),async function(){
  await writeFile('data/session_renew.json',{expiresAt:Math.floor(Date.now()/1000)+15*60,mode:'mixed',stop:false},'session: +15min');
  toast('⏱ 已续期 +15 分钟','ok'); refresh();
}); };
$('btnStop').onclick=function(){ busy($('btnStop'),async function(){
  await writeFile('data/session_renew.json',{expiresAt:0,stop:true},'session: stop by panel');
  toast('■ 已发停止信号（云端下一轮退出）','warn'); refresh();
}); };

$('btnNow').onclick=function(){ busy($('btnNow'),async function(){
  const p=$('prompt').value.trim(); if(!p){ toast('请先写提示词','err'); return; }
  await dispatch('generate.yml',{prompt:p,model:$('model').value,dim:$('dim').value,count:$('count').value});
  toast('⚡ 已提交云端生图\n约 1~3 分钟后到【🖼 画廊】看图','ok',7000);
  setTimeout(refresh,15000);
}); };
$('btnQueue').onclick=function(){ busy($('btnQueue'),async function(){
  const p=$('prompt').value.trim(); if(!p){ toast('请先写提示词','err'); return; }
  const cur=await readFile('data/queue.json'); let q=[]; try{q=JSON.parse(cur.text||'[]')}catch(e){}
  q.push({id:'p'+Date.now(),prompt:p,model:$('model').value,dim:$('dim').value,ts:Math.floor(Date.now()/1000)});
  await writeFile('data/queue.json',q,'queue: add job');
  toast('＋ 已排队（共 '+q.length+' 条）\n会话跑着时会自动取走执行','ok',6000); refresh();
}); };

bootPage({ title:'控制台', active:'index.html', onReady:function(){
  refresh(); WBI.TIMER=setInterval(refresh,20000);
}});
</script>
</body>
</html>
